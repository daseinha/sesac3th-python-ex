<!-- templates/in.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 뉴스 AI 선플 생성기</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 14px; background-color: #03c75a; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #029f48; }
        .guide { color: #666; font-size: 14px; margin-bottom: 24px; }
    </style>
</head>
<body>
    <h1>🔍 네이버 뉴스 AI 선플 생성기</h1>
    <p class="guide">키워드를 입력하면 최신 네이버 뉴스를 자동으로 검색하여 기사별 긍정 댓글을 작성합니다.</p>
    
    <form action="/out" method="POST">
        <div class="form-group">
            <label for="keyword">검색 키워드</label>
            <input type="text" id="keyword" name="keyword" placeholder="예: 엔화, 인공지능, 자율주행" required>
        </div>

        <div class="form-group">
            <label for="display">가져올 기사 개수</label>
            <select id="display" name="display">
                <option value="3">3개</option>
                <option value="5" selected>5개</option>
                <option value="10">10개</option>
            </select>
        </div>

        <button type="submit">뉴스 검색 및 댓글 생성 시작</button>
    </form>
</body>
</html>
