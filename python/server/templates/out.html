<!-- templates/out.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 선플 생성 결과</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .summary-box { background: #f0f4f8; padding: 12px 18px; border-radius: 8px; margin-bottom: 25px; }
        .card { border: 1px solid #e1e4e8; border-radius: 10px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .link { font-size: 13px; color: #0066cc; text-decoration: none; word-break: break-all; }
        .content { color: #555; font-size: 14px; margin: 12px 0; background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
        .ai-comment { background: #e8f5e9; border-left: 4px solid #2e7d32; padding: 12px 16px; border-radius: 4px; font-size: 15px; color: #1b5e20; }
        .btn-back { display: inline-block; margin-top: 15px; padding: 10px 18px; background: #333; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; }
        .btn-back:hover { background: #555; }
    </style>
</head>
<body>
    <h1>✨ AI 선플 생성 결과</h1>
    
    <div class="summary-box">
        <strong>검색 키워드:</strong> "{{ keyword }}" &nbsp;|&nbsp; 
        <strong>처리된 기사:</strong> {{ results|length }}건
    </div>

    {% if results %}
        {% for item in results %}
            <div class="card">
                <div class="title">{{ item.title }}</div>
                <a href="{{ item.link }}" target="_blank" class="link">{{ item.link }}</a>
                <div class="content"><strong>본문 요약:</strong> {{ item.content }}</div>
                <div class="ai-comment">
                    <strong>💬 AI 생성 댓글:</strong><br>
                    {{ item.comment }}
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>검색 결과 중 본문을 추출할 수 있는 네이버 뉴스 기사가 없습니다.</p>
    {% endif %}

    <a href="/" class="btn-back">← 다시 검색하기</a>
</body>
</html>
